services:
  - type: web
    name: acima-do-comum-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true --browser.gatherUsageStats=false
    healthCheckPath: /_stcore/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ADC_PANEL_PASSWORD
        sync: false
      - key: ADC_MODEL
        value: gpt-5
